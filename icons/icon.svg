<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fe3ff"/>
      <stop offset="58%" stop-color="#cdf3ff"/>
      <stop offset="59%" stop-color="#86e05a"/>
      <stop offset="100%" stop-color="#4aa832"/>
    </linearGradient>
    <radialGradient id="petal" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#ff8fb1"/>
      <stop offset="100%" stop-color="#ff5d92"/>
    </radialGradient>
    <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb85e"/>
      <stop offset="100%" stop-color="#456f2e"/>
    </linearGradient>
    <radialGradient id="skinG" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#ffe6c9"/>
      <stop offset="100%" stop-color="#f9c99b"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- bông hoa mìn phía sau -->
  <g transform="translate(256 250)" opacity=".95">
    <g>
      <ellipse cx="0" cy="-118" rx="52" ry="80" fill="url(#petal)"/>
      <ellipse cx="0" cy="-118" rx="52" ry="80" fill="url(#petal)" transform="rotate(45)"/>
      <ellipse cx="0" cy="-118" rx="52" ry="80" fill="url(#petal)" transform="rotate(90)"/>
      <ellipse cx="0" cy="-118" rx="52" ry="80" fill="url(#petal)" transform="rotate(135)"/>
      <ellipse cx="0" cy="-118" rx="52" ry="80" fill="url(#petal)" transform="rotate(180)"/>
      <ellipse cx="0" cy="-118" rx="52" ry="80" fill="url(#petal)" transform="rotate(225)"/>
      <ellipse cx="0" cy="-118" rx="52" ry="80" fill="url(#petal)" transform="rotate(270)"/>
      <ellipse cx="0" cy="-118" rx="52" ry="80" fill="url(#petal)" transform="rotate(315)"/>
    </g>
    <circle r="104" fill="#ffd166"/>
    <circle r="104" fill="none" stroke="#fff" stroke-width="9" opacity=".85"/>
  </g>

  <!-- chiến sĩ nhí -->
  <g transform="translate(256 268) scale(2.55)">
    <ellipse cx="-28" cy="2" rx="5" ry="6" fill="#f9c99b"/>
    <ellipse cx="28" cy="2" rx="5" ry="6" fill="#f9c99b"/>
    <circle cx="0" cy="0" r="27" fill="url(#skinG)"/>
    <ellipse cx="-10" cy="1" rx="6.2" ry="7" fill="#fff"/>
    <ellipse cx="10" cy="1" rx="6.2" ry="7" fill="#fff"/>
    <circle cx="-9" cy="2.5" r="4" fill="#2b2b3a"/>
    <circle cx="11" cy="2.5" r="4" fill="#2b2b3a"/>
    <circle cx="-7.4" cy=".6" r="1.5" fill="#fff"/>
    <circle cx="12.6" cy=".6" r="1.5" fill="#fff"/>
    <ellipse cx="-19" cy="10" rx="5.5" ry="3.6" fill="#ffb0b8" opacity=".75"/>
    <ellipse cx="19" cy="10" rx="5.5" ry="3.6" fill="#ffb0b8" opacity=".75"/>
    <path d="M-7 12 Q0 19 7 12" stroke="#b4593f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M-32 -12 Q0 -48 32 -12 Z" fill="url(#capG)"/>
    <ellipse cx="0" cy="-12" rx="35" ry="7.5" fill="#3f6a2b"/>
    <ellipse cx="0" cy="-15" rx="35" ry="6" fill="#5b8c42"/>
    <path d="M0,-32 L1.53,-28.1 L5.71,-27.85 L2.47,-25.2 L3.53,-21.15 L0,-23.4 L-3.53,-21.15 L-2.47,-25.2 L-5.71,-27.85 L-1.53,-28.1 Z"
